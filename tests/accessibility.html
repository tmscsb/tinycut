<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrimKit accessibility checks</title><style>body{font:16px system-ui;margin:24px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:100%;height:720px;border:1px solid #ccc}</style><h1>TrimKit accessibility checks</h1><button id="run">Run accessibility checks</button><p id="status" role="status">Ready</p><pre id="results"></pre><iframe id="app" src="/" title="TrimKit editor under test"></iframe><script type="module">
import axe from 'axe-core';
const button=document.querySelector('#run');const results=document.querySelector('#results');const status=document.querySelector('#status');const frame=document.querySelector('#app');
button.onclick=async()=>{
 button.disabled=true;results.textContent='';status.textContent='Running…';
 const doc=frame.contentDocument;
 // Audit settled colors; background tabs can pause CSS transitions midway.
 const motion=doc.createElement('style');motion.textContent='*,*::before,*::after{transition:none!important;animation:none!important}';doc.head.append(motion);
 if (!frame.contentWindow.axe) { const script=doc.createElement("script"); script.textContent=axe.source; doc.head.append(script); }
 const wait=()=>new Promise(resolve=>setTimeout(resolve,250));
 const check=async(name)=>{
  await wait();
  const result=await frame.contentWindow.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}});
  results.textContent+=JSON.stringify({name,violations:result.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}))},null,2)+'\n';
 };
 const clickText=(text)=>{
  const target=[...doc.querySelectorAll('button')].find(button=>button.textContent.trim()===text);
  if(!target) throw new Error('Missing button: '+text);
  target.click();
 };
 try{
  for(let theme=0;theme<2;theme++){
   const prefix=doc.documentElement.dataset.theme+' / ';
   await check(prefix+'Page');
   doc.querySelector('[aria-label="Add rectangle"]').click(); await check(prefix+'Rectangle inspector');
   doc.querySelector('[aria-label="Add text"]').click(); await check(prefix+'Text inspector');
   doc.querySelector('[aria-label="Export menu"]').click(); await check(prefix+'Export menu');
   doc.querySelector('[aria-label="Export menu"]').click();
   doc.querySelector('[aria-label="Keyboard shortcuts"]').click(); await check(prefix+'Shortcuts dialog');
   doc.querySelector('.modal-action button').click();
   const imageInput=doc.querySelector('input[type="file"][multiple]');
   const transfer=new DataTransfer();
   transfer.items.add(new File([await (await fetch('/tests/fixtures/sample.svg')).blob()],'sample.svg',{type:'image/svg+xml'}));
   imageInput.files=transfer.files;
   imageInput.dispatchEvent(new Event('change',{bubbles:true}));
   await wait(); await check(prefix+'Image inspector');
   clickText('Crop Image'); await check(prefix+'Crop inspector');
   clickText('Exit Crop Mode'); await wait();
   clickText('Page settings'); await check(prefix+'Page settings');
   doc.querySelector('[aria-label="Project menu"]').click(); await check(prefix+'Project menu');
   clickText('New document'); await check(prefix+'Unsaved changes dialog');
   clickText('Cancel');
   doc.querySelector('.theme-control').click(); await wait();
  }
  status.textContent='Accessibility checks complete';
  motion.remove();
 }catch(error){status.textContent='Failed: '+error.message;}finally{button.disabled=false;}
};
</script></html>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TinyCut",
        "alternateName": "TinyCut — Free Print Layout Editor",
        "url": "https://tinycut.pages.dev/",
        "description": "Free print layout editor in your browser. Crop and size images in millimeters, then export SVG, JPEG, PNG, or PDF. No account — files stay on your device.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Runs in a modern web browser.",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Place images on A4, A5, A6, Letter, or custom pages at exact millimeter sizes",
          "Crop and cut image regions without sending files to a server",
          "Add rectangles, circles, lines, and editable text",
          "Export layered SVG, JPEG, or PNG, or print and save as PDF"
        ],
        "image": "https://tinycut.pages.dev/og-image.png",
        "screenshot": "https://tinycut.pages.dev/og-image.png",
        "license": "https://github.com/tmscsb/tinycut/blob/main/LICENSE",
        "codeRepository": "https://github.com/tmscsb/tinycut",
        "inLanguage": "en"
      }
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("trimkit-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <article style="max-width:42rem;margin:2.5rem auto;padding:0 1.5rem;font:16px/1.55 system-ui,sans-serif;color:#111827">
        <h1>TinyCut — Free Print Layout Editor</h1>
        <p>TinyCut is a free in-browser print layout editor. Place, crop, and size images in millimeters on A4, A5, A6, Letter, or custom pages, then export SVG, JPEG, PNG, or PDF. There is no account. Images and projects stay on your device.</p>
        <p><strong>JavaScript is required to use the editor.</strong> Enable JavaScript in your browser, then reload this page.</p>
        <h2>What you can do</h2>
        <ul>
          <li>Import PNG, JPEG, WebP, and SVG images</li>
          <li>Resize to exact millimeter or centimeter dimensions</li>
          <li>Crop images or cut several details from one photo</li>
          <li>Add rectangles, circles, lines, and editable text</li>
          <li>Print at the real page size, or save a PDF from the print dialog</li>
        </ul>
        <p>Source code: <a href="https://github.com/tmscsb/tinycut">github.com/tmscsb/tinycut</a></p>
      </article>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
